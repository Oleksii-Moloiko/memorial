[project]
name = "memorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-environ>=0.14.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "coverage>=7.15.3",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "htmlcov",
    "staticfiles",
    "media",
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"